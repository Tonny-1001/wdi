<style>:root{--bg:#0d1424;--pn:#101a2e;--cd:#142038;--fg:#f2f4f8;--mu:#9aa6bb;--bd:#22304d;--ac:#e0262d;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}body{font:15px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#map{position:fixed;inset:0}
.b{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.s{position:absolute;transform:translate(-50%,-50%);font:italic 600 11px/1 system-ui;color:#c4cddd;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
#lp,#rp{position:fixed;top:0;bottom:0;background:var(--pn);display:flex;flex-direction:column;z-index:5;transition:transform .25s}
#lp{left:0;width:min(340px,100%);border-right:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}#lp.off{transform:translateX(-100%)}
#rp{right:0;width:min(360px,100%);border-left:1px solid var(--bd);transform:translateX(100%)}#rp.on{transform:none}
.hd{display:flex;align-items:center;gap:12px;padding:16px}.lg{width:44px;height:44px;border-radius:12px;background:#3a1620;border:1px solid #6a2230;display:grid;place-items:center;font-size:22px}
.hd h1{margin:0;font-size:19px}.hd small{color:var(--mu)}.x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);font-size:16px;cursor:pointer}
#q{margin:0 16px;width:calc(100% - 32px);box-sizing:border-box;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:#0a1020;color:var(--fg);font:inherit;outline:0}#q:focus{border-color:var(--ac)}
#ch{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex:none}#ch button{flex:none;padding:7px 14px;border-radius:20px;border:0;background:var(--cd);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}#ch button.on{background:var(--ac)}
#ls{flex:1;overflow:auto;padding:4px 14px 14px;border-top:1px solid var(--bd)}.it{display:flex;gap:12px;align-items:center;padding:10px;margin-top:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;cursor:pointer}.it.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.cd{flex:none;min-width:46px;padding:11px 4px;text-align:center;font-weight:700;font-size:13px;background:#0a1020;border:1px solid var(--bd);border-radius:10px}.it b{display:block;font-weight:600;font-size:14px}.tg{display:inline-block;margin-top:4px;padding:2px 8px;font-size:11px;border-radius:5px;border:1px solid #7a2a33;background:#3a1620;color:#ff6b72}
#op{position:fixed;left:12px;top:12px;z-index:4;display:none;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);cursor:pointer}
.rh{position:relative;padding:20px;background:linear-gradient(135deg,#2a1020,#10192e);border-bottom:1px solid var(--bd);overflow:hidden}.rh .tg{font-size:12px;letter-spacing:.5px;text-transform:uppercase;padding:5px 10px;border-radius:8px}
.rh .x{position:absolute;right:16px;top:16px}.big{font-size:46px;font-weight:800;margin:28px 0 2px}.rh span{font-size:17px}.wm{position:absolute;right:-10px;bottom:-14px;font-size:120px;font-weight:800;color:#fff;opacity:.06}
#rb{flex:1;overflow:auto;padding:20px}h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;color:var(--mu);text-transform:uppercase}.bx{padding:14px 16px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}
.bx+.bx{margin-top:-2px}#rb section{margin-bottom:22px}#go{display:flex;justify-content:center;gap:10px;align-items:center;margin:16px;padding:16px;background:var(--ac);color:#fff;border-radius:14px;text-decoration:none;font-weight:700;box-shadow:0 6px 18px #e0262d55;margin-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media(max-width:700px){#lp{width:100%;top:auto;height:46%;border-right:0;border-top:1px solid var(--bd)}#lp.off{transform:translateY(100%)}#rp{top:auto;height:62%;width:100%;transform:translateY(100%);z-index:6}.big{font-size:34px;margin-top:14px}}
.pin{padding:3px 7px;border-radius:7px;background:#e0262d;color:#fff;font:700 11px/1 system-ui;border:1.5px solid #fff;box-shadow:0 1px 4px #0008;cursor:pointer;white-space:nowrap}
.pin.g{background:#2f8f66}.pin.t{background:#1b7686}.pin.on{background:#fff;color:#e0262d;border-color:#e0262d;font-size:13px;box-shadow:0 0 0 4px #e0262d66,0 2px 8px #000a;z-index:9}
.st{font:italic 600 11px/1 system-ui;color:#233;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none}
#tk{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#0d1424ee;padding:20px}
#tk>div{max-width:520px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:22px}
#tk h2{margin:0 0 8px}#tk p{color:var(--mu);margin:8px 0}#tk textarea{width:100%;box-sizing:border-box;height:90px;border-radius:10px;border:1px solid var(--bd);background:#0a1020;color:var(--fg);padding:10px;font:12px monospace}
#tk button{margin-top:10px;padding:11px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:700 14px system-ui;cursor:pointer}
#vw{position:fixed;right:12px;top:12px;z-index:4;display:flex;gap:6px}#vw button{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--fg);cursor:pointer;font:600 13px system-ui}
@media(max-width:700px){#vw{top:auto;bottom:calc(46% + 10px)}}
